[project]
name = "qz-user-service"
version = "0.1.0"
description = "QZ-FRP user service backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlalchemy[asyncio]>=2.0.30",
  "aiomysql>=0.2.0",
  "pymysql>=1.1.0",
  "aiosqlite>=0.20.0",
  "bcrypt>=4.1.2",
  "httpx>=0.27.0",
  "alembic>=1.13.0",
  "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
