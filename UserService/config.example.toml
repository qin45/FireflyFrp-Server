[server]
host = "0.0.0.0"
port = 8080
admin_token = "replace-with-a-long-random-admin-token"
session_ttl_hours = 168
cors_origins = ["http://localhost:3000"]
# Keep true for local development. In production use `alembic upgrade head`
# and set this to false.
auto_create_tables = false

# Serve the API and frps plugin endpoint over HTTPS. Set port to 8443/443
# as appropriate. If no certificate exists, tls_self_signed = true generates
# one on startup; otherwise provide both cert and key paths.
enable_https = false
tls_self_signed = false
tls_cert_file = "certs/server.crt"
tls_key_file = "certs/server.key"
tls_hosts = ["localhost", "127.0.0.1"]

[database]
# Production (MySQL):
url = "mysql+aiomysql://fireflyfrp:password@127.0.0.1:3306/fireflyfrp?charset=utf8mb4"
# Local development without MySQL:
# url = "sqlite+aiosqlite:///./fireflyfrp.db"

[frps]
api_url = "http://127.0.0.1:7500"
api_user = "admin"
api_password = "replace-with-frps-dashboard-password"
public_host = "frp.example.com"
bind_port = 7000
auth_token = "shared-frps-token"
subdomain_host = "frp.example.com"   # must equal frps subDomainHost
vhost_http_port = 80
vhost_https_port = 443
plugin_path_secret = "replace-with-a-random-plugin-secret"
# Keep loopback for same-host deployments. Add the frps egress IP/CIDR when
# frps runs on another machine.
plugin_trusted_cidrs = ["127.0.0.1/32", "::1/128"]

[limits]
port_range_start = 20000
port_range_end = 30000
max_tunnels_per_user = 10
max_active_tunnels = 3
default_rate_limit_mbps = 10
default_traffic_quota_bytes = 0   # new users must be topped up by an admin
traffic_poll_interval_seconds = 2
# Set to false on nodes that do not expose frps vhost HTTP/HTTPS ports.
# Disabled types cannot be created or started.
enable_http_tunnels = true
enable_https_tunnels = true
